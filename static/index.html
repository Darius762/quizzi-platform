<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2rem; margin-bottom: 8px; }
        .header p { opacity: 0.85; font-size: 1rem; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .card h2 { color: #333; margin-bottom: 20px; font-size: 1.2rem; }

        .upload-zone {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #667eea;
        }
        .upload-zone:hover { background: #f5f3ff; }
        .upload-zone.active { background: #f5f3ff; border-color: #764ba2; }
        .upload-zone input { display: none; }
        .upload-icon { font-size: 3rem; margin-bottom: 10px; }
        .upload-zone p { color: #666; margin-top: 8px; }
        .file-name { color: #764ba2; font-weight: 600; margin-top: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }

        .checkboxes { display: flex; gap: 20px; flex-wrap: wrap; }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .checkbox-item:hover { border-color: #667eea; }
        .checkbox-item input { accent-color: #667eea; width: 16px; height: 16px; }
        .checkbox-item.checked { border-color: #667eea; background: #f5f3ff; }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-generate:hover { opacity: 0.9; }
        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .quiz-results { display: none; }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .quiz-header h2 { color: #333; }
        .badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .question-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .question-card:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102,126,234,0.1); }

        .question-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .q-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .q-type {
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }
        .type-multiple_choice { background: #e3f2fd; color: #1976d2; }
        .type-true_false { background: #e8f5e9; color: #388e3c; }
        .type-fill_in_the_blank { background: #fff3e0; color: #f57c00; }

        .question-text { font-weight: 500; color: #333; margin-bottom: 14px; font-size: 1rem; }

        .options { display: grid; gap: 8px; }
        .option {
            padding: 10px 14px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #555;
        }
        .option.correct { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 500; }

        .answer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #2e7d32;
            font-weight: 500;
        }

        .explanation {
            margin-top: 12px;
            padding: 10px 14px;
            background: #f8f9fa;
            border-left: 3px solid #667eea;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #555;
        }

        .error-msg {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .btn-reset {
            padding: 10px 24px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background: #f5f3ff; }
    </style>
</head>
<body>

<div class="header">
    <h1>🎓 Quiz Generator</h1>
    <p>Incarca un PDF si genereaza intrebari automat cu AI</p>
</div>

<div class="container">
    <!-- Form -->
    <div class="card" id="formCard">
        <h2>📄 Incarca materialul de curs</h2>

        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept=".pdf" onchange="handleFile(this)">
            <div class="upload-icon">📁</div>
            <strong>Click pentru a selecta un PDF</strong>
            <p>sau trage fisierul aici</p>
            <div class="file-name" id="fileName"></div>
        </div>

        <br>

        <div class="form-group">
            <label>🎯 Topic (optional)</label>
            <input type="text" id="topic" value="toate conceptele importante" placeholder="ex: programare orientata pe obiecte">
        </div>

        <div class="form-group">
            <label>🔢 Numar de intrebari</label>
            <input type="number" id="numQuestions" value="10" min="3" max="20">
        </div>

        <div class="form-group">
            <label>📝 Tipuri de intrebari</label>
            <div class="checkboxes">
                <label class="checkbox-item checked" id="label_mc">
                    <input type="checkbox" id="cb_mc" value="multiple_choice" checked onchange="toggleCheck('label_mc', this)">
                    Multiple Choice
                </label>
                <label class="checkbox-item checked" id="label_tf">
                    <input type="checkbox" id="cb_tf" value="true_false" checked onchange="toggleCheck('label_tf', this)">
                    Adevarat / Fals
                </label>
                <label class="checkbox-item checked" id="label_fb">
                    <input type="checkbox" id="cb_fb" value="fill_in_the_blank" checked onchange="toggleCheck('label_fb', this)">
                    Completeaza spatiul
                </label>
            </div>
        </div>

        <button class="btn-generate" id="btnGenerate" onclick="generateQuiz()">
            ✨ Genereaza Quiz
        </button>

        <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Loading -->
    <div class="card loading" id="loadingCard">
        <div class="spinner"></div>
        <h3>Se genereaza quiz-ul...</h3>
        <p style="color:#999; margin-top:8px">Acest proces dureaza 10-30 secunde</p>
    </div>

    <!-- Results -->
    <div class="quiz-results" id="quizResults">
        <div class="card">
            <div class="quiz-header">
                <h2>✅ Quiz Generat</h2>
                <div style="display:flex; gap:10px; align-items:center">
                    <span class="badge" id="questionCount"></span>
                    <button class="btn-reset" onclick="resetForm()">🔄 Quiz Nou</button>
                </div>
            </div>
            <div id="questionsContainer"></div>
        </div>
    </div>
</div>

<script>
    let selectedFile = null;

    function handleFile(input) {
        if (input.files[0]) {
            selectedFile = input.files[0];
            document.getElementById('fileName').textContent = '✓ ' + selectedFile.name;
            document.getElementById('uploadZone').classList.add('active');
        }
    }

    function toggleCheck(labelId, checkbox) {
        const label = document.getElementById(labelId);
        if (checkbox.checked) {
            label.classList.add('checked');
        } else {
            label.classList.remove('checked');
        }
    }

    async function generateQuiz() {
        if (!selectedFile) {
            showError('Te rog selecteaza un fisier PDF!');
            return;
        }

        const types = [];
        if (document.getElementById('cb_mc').checked) types.push('multiple_choice');
        if (document.getElementById('cb_tf').checked) types.push('true_false');
        if (document.getElementById('cb_fb').checked) types.push('fill_in_the_blank');

        if (types.length === 0) {
            showError('Selecteaza cel putin un tip de intrebare!');
            return;
        }

        document.getElementById('loadingCard').style.display = 'block';
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('btnGenerate').disabled = true;

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('topic', document.getElementById('topic').value);
        formData.append('num_questions', document.getElementById('numQuestions').value);
        formData.append('question_types', types.join(','));

        try {
            const response = await fetch('/api/generate-quiz', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                displayQuiz(data.quiz);
            } else {
                document.getElementById('formCard').style.display = 'block';
                showError('Eroare: ' + data.error);
            }
        } catch (err) {
            document.getElementById('formCard').style.display = 'block';
            showError('Eroare de conexiune: ' + err.message);
        } finally {
            document.getElementById('loadingCard').style.display = 'none';
            document.getElementById('btnGenerate').disabled = false;
        }
    }

    function displayQuiz(quiz) {
        const questions = quiz.questions;
        document.getElementById('questionCount').textContent = questions.length + ' intrebari';

        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        questions.forEach((q, i) => {
            const typeLabels = {
                'multiple_choice': 'Multiple Choice',
                'true_false': 'Adevarat / Fals',
                'fill_in_the_blank': 'Completeaza'
            };

            let answerHTML = '';

            if (q.type === 'multiple_choice' && q.options) {
                const optionsHTML = Object.entries(q.options).map(([key, val]) => {
                    const isCorrect = key === q.correct_answer;
                    return `<div class="option ${isCorrect ? 'correct' : ''}">${key}) ${val}</div>`;
                }).join('');
                answerHTML = `<div class="options">${optionsHTML}</div>`;
            } else {
                answerHTML = `
                    <div class="answer-row">
                        ✓ Raspuns corect: <strong>${q.correct_answer || 'N/A'}</strong>
                    </div>`;
            }

            const explanationHTML = q.explanation
                ? `<div class="explanation">💡 ${q.explanation}</div>`
                : '';

            container.innerHTML += `
                <div class="question-card">
                    <div class="question-header">
                        <div class="q-number">${i + 1}</div>
                        <span class="q-type type-${q.type}">${typeLabels[q.type] || q.type}</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    ${answerHTML}
                    ${explanationHTML}
                </div>`;
        });

        document.getElementById('quizResults').style.display = 'block';
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function resetForm() {
        document.getElementById('quizResults').style.display = 'none';
        document.getElementById('formCard').style.display = 'block';
        document.getElementById('fileName').textContent = '';
        document.getElementById('uploadZone').classList.remove('active');
        selectedFile = null;
        document.getElementById('fileInput').value = '';
    }
</script>

</body>
</html>
